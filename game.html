<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スネークゲーム</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Arial', sans-serif;
      color: #fff;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 16px;
      letter-spacing: 4px;
      color: #00ff88;
      text-shadow: 0 0 10px #00ff88;
    }

    #score-board {
      display: flex;
      gap: 32px;
      margin-bottom: 16px;
      font-size: 1rem;
    }

    #score-board span {
      color: #aaa;
    }

    #score-board strong {
      color: #fff;
    }

    #canvas {
      border: 2px solid #00ff88;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
    }

    #message {
      margin-top: 20px;
      font-size: 1.1rem;
      color: #ffcc00;
      min-height: 28px;
      text-align: center;
    }

    #controls {
      margin-top: 20px;
      color: #666;
      font-size: 0.85rem;
      text-align: center;
      line-height: 1.8;
    }

    button {
      margin-top: 16px;
      padding: 10px 28px;
      background: #00ff88;
      color: #1a1a2e;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #00cc6a;
    }

    a.back {
      margin-top: 24px;
      color: #555;
      font-size: 0.85rem;
      text-decoration: none;
    }

    a.back:hover {
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1>SNAKE</h1>

  <div id="score-board">
    <div><span>スコア: </span><strong id="score">0</strong></div>
    <div><span>ハイスコア: </span><strong id="high-score">0</strong></div>
  </div>

  <canvas id="canvas" width="400" height="400"></canvas>

  <div id="message">スペースキーでスタート</div>

  <button id="btn">スタート</button>

  <div id="controls">
    矢印キー / WASD で移動<br>
    スペースキーでスタート / 一時停止
  </div>

  <a class="back" href="index.html">← トップページへ戻る</a>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const CELL = 20;
    const COLS = canvas.width / CELL;
    const ROWS = canvas.height / CELL;

    let snake, dir, nextDir, food, score, highScore, state, intervalId;

    highScore = 0;

    function init() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      updateScore();
      placeFood();
      state = 'idle';
      draw();
      document.getElementById('message').textContent = 'スペースキーでスタート';
    }

    function placeFood() {
      let pos;
      do {
        pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      food = pos;
    }

    function updateScore() {
      document.getElementById('score').textContent = score;
      document.getElementById('high-score').textContent = highScore;
    }

    function draw() {
      ctx.fillStyle = '#0d0d1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // grid (subtle)
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 0.5;
      for (let x = 0; x <= COLS; x++) {
        ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, canvas.height); ctx.stroke();
      }
      for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(canvas.width, y * CELL); ctx.stroke();
      }

      // food
      ctx.fillStyle = '#ff4466';
      ctx.shadowColor = '#ff4466';
      ctx.shadowBlur = 10;
      ctx.fillRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4);
      ctx.shadowBlur = 0;

      // snake
      snake.forEach((seg, i) => {
        const ratio = 1 - i / snake.length * 0.6;
        ctx.fillStyle = i === 0
          ? '#00ff88'
          : `rgba(0, ${Math.floor(200 * ratio)}, ${Math.floor(100 * ratio)}, 1)`;
        if (i === 0) {
          ctx.shadowColor = '#00ff88';
          ctx.shadowBlur = 12;
        } else {
          ctx.shadowBlur = 0;
        }
        ctx.fillRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);
      });
      ctx.shadowBlur = 0;
    }

    function step() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // wall collision
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        gameOver(); return;
      }
      // self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver(); return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        if (score > highScore) highScore = score;
        updateScore();
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function gameOver() {
      clearInterval(intervalId);
      state = 'over';
      draw();
      document.getElementById('message').textContent = `ゲームオーバー！ スコア: ${score}`;
    }

    function startGame() {
      if (intervalId) clearInterval(intervalId);
      init();
      state = 'running';
      document.getElementById('message').textContent = '';
      intervalId = setInterval(step, 120);
    }

    function togglePause() {
      if (state === 'running') {
        clearInterval(intervalId);
        state = 'paused';
        document.getElementById('message').textContent = '一時停止中';
      } else if (state === 'paused') {
        state = 'running';
        document.getElementById('message').textContent = '';
        intervalId = setInterval(step, 120);
      }
    }

    document.getElementById('btn').addEventListener('click', startGame);

    document.addEventListener('keydown', e => {
      switch (e.key) {
        case 'ArrowUp': case 'w': case 'W':
          if (dir.y !== 1) nextDir = { x: 0, y: -1 }; break;
        case 'ArrowDown': case 's': case 'S':
          if (dir.y !== -1) nextDir = { x: 0, y: 1 }; break;
        case 'ArrowLeft': case 'a': case 'A':
          if (dir.x !== 1) nextDir = { x: -1, y: 0 }; break;
        case 'ArrowRight': case 'd': case 'D':
          if (dir.x !== -1) nextDir = { x: 1, y: 0 }; break;
        case ' ':
          e.preventDefault();
          if (state === 'idle' || state === 'over') startGame();
          else togglePause();
          break;
      }
    });

    init();
  </script>
</body>
</html>
