<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>スネークゲーム</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Arial', sans-serif;
      color: #fff;
      padding: 16px;
      touch-action: none;
      user-select: none;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 12px;
      letter-spacing: 4px;
      color: #00ff88;
      text-shadow: 0 0 10px #00ff88;
    }

    #score-board {
      display: flex;
      gap: 32px;
      margin-bottom: 12px;
      font-size: 1rem;
    }

    #score-board span { color: #aaa; }
    #score-board strong { color: #fff; }

    #canvas {
      border: 2px solid #00ff88;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
      max-width: 100%;
    }

    #message {
      margin-top: 12px;
      font-size: 1rem;
      color: #ffcc00;
      min-height: 24px;
      text-align: center;
    }

    #btn {
      margin-top: 12px;
      padding: 10px 28px;
      background: #00ff88;
      color: #1a1a2e;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #btn:active { background: #00cc6a; }

    /* D-pad */
    #dpad {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(3, 60px);
      gap: 4px;
    }

    .dpad-btn {
      background: rgba(0, 255, 136, 0.15);
      border: 2px solid rgba(0, 255, 136, 0.4);
      border-radius: 8px;
      color: #00ff88;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s;
    }

    .dpad-btn:active, .dpad-btn.pressed {
      background: rgba(0, 255, 136, 0.4);
    }

    .dpad-empty { background: transparent; border: none; }

    #controls-hint {
      margin-top: 16px;
      color: #555;
      font-size: 0.8rem;
      text-align: center;
      line-height: 1.8;
    }

    a.back {
      margin-top: 20px;
      color: #555;
      font-size: 0.85rem;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>SNAKE</h1>

  <div id="score-board">
    <div><span>スコア: </span><strong id="score">0</strong></div>
    <div><span>ハイスコア: </span><strong id="high-score">0</strong></div>
  </div>

  <canvas id="canvas" width="400" height="400"></canvas>

  <div id="message">ボタンを押してスタート</div>

  <button id="btn">スタート</button>

  <!-- D-pad: up/down/left/right buttons -->
  <div id="dpad">
    <div class="dpad-empty"></div>
    <div class="dpad-btn" id="d-up">▲</div>
    <div class="dpad-empty"></div>
    <div class="dpad-btn" id="d-left">◀</div>
    <div class="dpad-empty"></div>
    <div class="dpad-btn" id="d-right">▶</div>
    <div class="dpad-empty"></div>
    <div class="dpad-btn" id="d-down">▼</div>
    <div class="dpad-empty"></div>
  </div>

  <div id="controls-hint">
    スワイプ or ボタンで操作<br>
    キーボード: 矢印キー / WASD
  </div>

  <a class="back" href="index.html">← トップページへ戻る</a>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Scale canvas to fit screen width on mobile
    function resizeCanvas() {
      const maxW = Math.min(window.innerWidth - 32, 400);
      canvas.style.width = maxW + 'px';
      canvas.style.height = maxW + 'px';
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const CELL = 20;
    const COLS = canvas.width / CELL;
    const ROWS = canvas.height / CELL;

    let snake, dir, nextDir, food, score, highScore, state, intervalId;
    highScore = 0;

    function init() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      updateScore();
      placeFood();
      state = 'idle';
      draw();
      document.getElementById('message').textContent = 'ボタンを押してスタート';
    }

    function placeFood() {
      let pos;
      do {
        pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      food = pos;
    }

    function updateScore() {
      document.getElementById('score').textContent = score;
      document.getElementById('high-score').textContent = highScore;
    }

    function draw() {
      ctx.fillStyle = '#0d0d1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 0.5;
      for (let x = 0; x <= COLS; x++) {
        ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, canvas.height); ctx.stroke();
      }
      for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(canvas.width, y * CELL); ctx.stroke();
      }

      ctx.fillStyle = '#ff4466';
      ctx.shadowColor = '#ff4466';
      ctx.shadowBlur = 10;
      ctx.fillRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4);
      ctx.shadowBlur = 0;

      snake.forEach((seg, i) => {
        const ratio = 1 - i / snake.length * 0.6;
        ctx.fillStyle = i === 0
          ? '#00ff88'
          : `rgba(0, ${Math.floor(200 * ratio)}, ${Math.floor(100 * ratio)}, 1)`;
        ctx.shadowColor = i === 0 ? '#00ff88' : 'transparent';
        ctx.shadowBlur = i === 0 ? 12 : 0;
        ctx.fillRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);
      });
      ctx.shadowBlur = 0;
    }

    function step() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        gameOver(); return;
      }
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver(); return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        if (score > highScore) highScore = score;
        updateScore();
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function gameOver() {
      clearInterval(intervalId);
      state = 'over';
      draw();
      document.getElementById('message').textContent = `ゲームオーバー！ スコア: ${score}`;
    }

    function startGame() {
      if (intervalId) clearInterval(intervalId);
      init();
      state = 'running';
      document.getElementById('message').textContent = '';
      intervalId = setInterval(step, 120);
    }

    function togglePause() {
      if (state === 'running') {
        clearInterval(intervalId);
        state = 'paused';
        document.getElementById('message').textContent = '一時停止中';
      } else if (state === 'paused') {
        state = 'running';
        document.getElementById('message').textContent = '';
        intervalId = setInterval(step, 120);
      }
    }

    function applyDir(dx, dy) {
      if (dx === 0 && dir.y === dy) return;
      if (dy === 0 && dir.x === dx) return;
      if (dir.x !== -dx || dir.y !== -dy) nextDir = { x: dx, y: dy };
    }

    // Keyboard
    document.addEventListener('keydown', e => {
      switch (e.key) {
        case 'ArrowUp':    case 'w': case 'W': applyDir(0, -1);  break;
        case 'ArrowDown':  case 's': case 'S': applyDir(0,  1);  break;
        case 'ArrowLeft':  case 'a': case 'A': applyDir(-1, 0);  break;
        case 'ArrowRight': case 'd': case 'D': applyDir(1,  0);  break;
        case ' ':
          e.preventDefault();
          if (state === 'idle' || state === 'over') startGame();
          else togglePause();
          break;
      }
    });

    // D-pad buttons
    function dpadPress(dx, dy) {
      if (state === 'idle' || state === 'over') { startGame(); return; }
      applyDir(dx, dy);
    }

    function bindDpad(id, dx, dy) {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', e => { e.preventDefault(); el.classList.add('pressed'); dpadPress(dx, dy); }, { passive: false });
      el.addEventListener('touchend',   e => { e.preventDefault(); el.classList.remove('pressed'); }, { passive: false });
      el.addEventListener('mousedown',  e => { dpadPress(dx, dy); });
    }

    bindDpad('d-up',    0, -1);
    bindDpad('d-down',  0,  1);
    bindDpad('d-left', -1,  0);
    bindDpad('d-right', 1,  0);

    // Swipe on canvas
    let touchStartX = 0, touchStartY = 0;

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;

      if (state === 'idle' || state === 'over') { startGame(); return; }

      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
        togglePause();
        return;
      }

      if (Math.abs(dx) > Math.abs(dy)) {
        applyDir(dx > 0 ? 1 : -1, 0);
      } else {
        applyDir(0, dy > 0 ? 1 : -1);
      }
    }, { passive: false });

    document.getElementById('btn').addEventListener('click', startGame);

    init();
  </script>
</body>
</html>
